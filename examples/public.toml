[server]
mode = "public"
device_id = "RDPublic123"
identity_file = "/var/lib/rdheadless/identity.json"
listen_host = "127.0.0.1"
listen_port = 21118
pam_service = "login"
# Optionally set a standard, persistent RustDesk connection password.
# The PAM login remains mandatory for terminal and file sessions.
# password_file = "/var/lib/rdheadless/connection-password"
shell = ""
login_shell = true
file_root = "/home"
file_auth_timeout = 180
allow_tunnel = false
tunnel_ports = []

enable_public_rendezvous = false
rendezvous_server = "hbbs.example.org:21116"
relay_server = "hbbr.example.org:21117"
