name: Import RustDesk Headless source
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import source
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '0b429914605b188af0dbd2fd2a80fc9fca8fac1b0e66710a59a074f9ab05eb97' bootstrap/source.tar.xz | sha256sum -c -
          tar -xJf bootstrap/source.tar.xz -C .
          test -f pyproject.toml
          test -f .github/workflows/verify.yml
          test -f .github/workflows/release.yml
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source files found'; exit 1; }
          git commit -m 'Import RustDesk Headless CLI source and CI workflows'
          git push origin HEAD:main
      - name: Trigger verification and release build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run verify.yml --ref main
          gh workflow run release.yml --ref main
